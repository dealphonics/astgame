name: Build Game

on:
  push:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build Fat JAR with Maven
        run: mvn clean package -DskipTests

      - name: Generate self-signed certificate
        run: |
          keytool -genkeypair -alias astgame -keyalg RSA -keysize 2048 \
            -storetype PKCS12 -keystore keystore.p12 -validity 3650 \
            -storepass changeit \
            -dname "CN=dealphonics, O=Voxel Asteroid, C=RU"

      - name: Sign JAR
        run: |
          jarsigner -keystore keystore.p12 -storepass changeit \
            target/asteroid-game-v1.jar astgame

      - name: Prepare Release Directory
        run: |
          mkdir -p deploy
          cp target/asteroid-game-v1.jar deploy/
          cp game.jnlp deploy/ || true
          cp index.html deploy/ || true

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy
